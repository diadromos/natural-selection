<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Natural Selection: Squirts</title>
<style>
body{font-family:system-ui,sans-serif;background:#222;color:#eee;display:flex;flex-direction:column;align-items:center;margin:20px}
#grid{display:grid;grid-template-columns:repeat(8,90px);gap:14px;padding:24px;border-radius:12px;margin:16px}
.org{width:90px;height:102px;display:flex;flex-direction:column;align-items:center;justify-content:center;font:10px monospace;color:inherit;transition:opacity .4s,transform .4s}.org svg{width:70px;height:86px}
.org{position:relative}.mark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:56px;pointer-events:none;filter:drop-shadow(0 0 3px #000)}.eaten>svg,.random>svg{opacity:.8}

button,input{font-size:15px;margin:4px;padding:6px 12px}
#stats{font-family:monospace;margin-top:8px;text-align:center}
</style>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="design/mobile.css"></head><body>
<h2>Natural Selection: Squirts</h2>
<div class="controls">
<button id="step" title="Run one generation. A red fish marks those the predator takes and a yellow skull those lost to chance, for a moment; then the survivors breed.">Next generation</button>
<input id="n" title="How many generations &quot;Run N generations&quot; will run. Ten by default." type="number" value="10" min="1">
<button id="multi" title="Run the number of generations in the box at once, with no marks, and show only the result.">Run N generations</button>
<button id="reset" title="Start over with a new random background, a new random population, and generation 0.">Reset</button>
<label><input type="checkbox" id="mut" title="When checked, each child has a 30% chance of a small change to its genes. Uncheck to allow only recombination." checked> Mutation</label>
</div>
<div class="controls"><label>Hue <input type="range" id="hue" title="Set the background hue around the color wheel, 0 to 360. It changes right away, without a reset." min="0" max="360" style="background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)"></label> <label>Value <input type="range" id="val" title="Move the background from white (0) through full hue (50) to black (100). It changes right away." min="0" max="100"></label></div>
<div id="bglabel" title="The background color as #RRGGBB. Use the Hue and Value sliders to change it."></div>
<div id="grid"></div>
<div id="stats" title="The generation count and the population&#x27;s average distance from the background. Lower means better camouflage."></div>
<p style="font-size:13px;color:#aaa">Each generation, a predator fish eats the 8 most visible squirts (red fish), 8 more die at random (skull and crossbones), and the 16 survivors pair up. Each child gets the hue of one parent and the value (brightness/saturation) of the other.</p>
<p class="nav"><a href="index.html" title="Go to the Color version: butterflies in full color.">Color</a><a href="mono.html" title="Go to the Monochrome version: gray moths with 32-bit genes.">Mono</a><a href="spots.html" title="Go to the Spots version: white moths with gray spots.">Spots</a><a href="squirts.html" class="active" aria-current="page">Squirts</a></p>
<script src="design/predator-anim/predator-svgs.js"></script><script src="design/predator-anim/predator-anim.js"></script>
<script>
const N=32,Q=N/4;let bg,pop,gen;
const rnd=()=>Math.floor(Math.random()*0x1000000);
const hex=c=>'#'+c.toString(16).padStart(6,'0').toUpperCase();
const rgb=c=>[c>>16&255,c>>8&255,c&255];
function toHSV(c){let[r,g,b]=rgb(c).map(x=>x/255),mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,h=0;
 if(d){if(mx==r)h=((g-b)/d)%6;else if(mx==g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}
 return{h,s:mx?d/mx:0,v:mx}}
function fromHSV(h,s,v){let c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c,[r,g,b]=h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];
 return(Math.round((r+m)*255)<<16)|(Math.round((g+m)*255)<<8)|Math.round((b+m)*255)}
function dist(a,b){const A=rgb(a),B=rgb(b);return Math.hypot(A[0]-B[0],A[1]-B[1],A[2]-B[2])}
const clamp=x=>Math.min(1,Math.max(0,x));
function child(hp,vp){let{h}=toHSV(hp),{s,v}=toHSV(vp);
 if(document.getElementById('mut').checked&&Math.random()<.3){h=(h+(Math.random()-.5)*40+360)%360;s=clamp(s+(Math.random()-.5)*.15);v=clamp(v+(Math.random()-.5)*.15)}
 return fromHSV(h,s,v)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function reset(){bg=rnd();syncSliders();pop=Array.from({length:N},rnd);gen=0;render()}
function lblColor(h){const L=[1,3,5].map(i=>{const c=parseInt(h.substr(i,2),16)/255;return c<=.04045?c/12.92:((c+.055)/1.055)**2.4}),Y=.2126*L[0]+.7152*L[1]+.0722*L[2];return (Y+.05)/.05>=1.05/(Y+.05)?'#000':'#fff'}
function render(marks={}){lastMarks=marks;const g=document.getElementById('grid');document.getElementById('bglabel').textContent='Background: '+hex(bg);g.style.background=hex(bg);g.style.color=lblColor(hex(bg));g.innerHTML='';
 pop.forEach((c,i)=>{const d=document.createElement('div');d.className='org '+(marks[i]||'');d.title="A squid and how closely its color matches the background, from 0 to 100%. The least hidden are eaten; a child takes the hue of one parent and the saturation and value of the other.";const f=hex(c);d.innerHTML=`<svg viewBox='0 0 80 100' style='color:${f}'><path fill='currentColor' stroke='#111' stroke-width='2.6' stroke-linejoin='round' stroke-linecap='round' d='M21,58 C15,48 8,36 8.5,24 C9,10 21,2.5 35,2.5 C50,2.5 60,12 62,26 C63.5,38 57,48 56,58 C57,67 60,77 62.5,85 C63.5,88 65,89 66.5,88.5 C69,88 69,92 66.5,93.5 C63,95.5 60,93 59,89 C57.5,84 56,79 55.7,73 C55.7,70.5 53.3,70.5 53.3,73 C53.6,82 53.6,91 55.3,93 C55.8,95.5 50,96.5 47,94 C45.3,92 44.7,82 45,73 C45,70.5 42.6,70.5 42.6,73 C42.9,82 42.6,95 38.5,95 C34.4,95 34.1,82 34.4,73 C34.4,70.5 32,70.5 32,73 C32.3,82 31.7,92 30,94 C27,96.5 21.2,95.5 21.7,93 C23.4,91 23.4,82 23.7,73 C23.7,70.5 21.3,70.5 21.3,73 C21,79 19.5,84 18,89 C17,93 14,95.5 10.5,93.5 C8,92 8,88 10.5,88.5 C12,89 13.5,88 14.5,85 C17,77 20,67 21,58 Z'/> <g> <ellipse cx='27.5' cy='54.5' rx='4.8' ry='6.5' fill='#111'/> <ellipse cx='50.5' cy='54.5' rx='4.8' ry='6.2' fill='#111'/> <ellipse cx='27' cy='55.5' rx='1.1' ry='1.5' fill='#fff'/> <ellipse cx='49' cy='56' rx='0.9' ry='1.6' fill='#fff'/> </g></svg><span>${(100*(1-(dist(c,bg)/(255*Math.sqrt(3))))).toFixed(1)}%</span>`+(marks[i]=='eaten'?`<div class='mark'><svg viewBox='0 0 80 80' width='80' height='80'><g fill='none' stroke='#000' stroke-opacity='.55' stroke-width='6.5' stroke-linejoin='round' stroke-linecap='round'><path d='M8 41 C13 30 26 24 40 24 C52 24 60 31 64 38 L75 28 L71 40.5 L75 53 L64 43 C59 50 48 56 36 56 C22 56 12 50 8 41 M8 41 L14 42 M24 30 C28 36 28 45 24 51 M27 26 L29 15 L33 25 L36 13 L39 24 L42 14.5 L45 24.5 M48 25 C51 16 58 18 60 31 M30 43 C34 47 38 47 41 44 M30 55 L27 63 L36 56 M47 54 C49 61 55 61 59 49'/><circle cx='17' cy='36' r='3.6' fill='#000' fill-opacity='.55' stroke='none'/></g><g fill='none' stroke='#e00' stroke-width='3' stroke-linejoin='round' stroke-linecap='round'><path d='M8 41 C13 30 26 24 40 24 C52 24 60 31 64 38 L75 28 L71 40.5 L75 53 L64 43 C59 50 48 56 36 56 C22 56 12 50 8 41 M8 41 L14 42 M24 30 C28 36 28 45 24 51 M27 26 L29 15 L33 25 L36 13 L39 24 L42 14.5 L45 24.5 M48 25 C51 16 58 18 60 31 M30 43 C34 47 38 47 41 44 M30 55 L27 63 L36 56 M47 54 C49 61 55 61 59 49'/><circle cx='17' cy='36' r='2' fill='#e00' stroke='none'/></g></svg></div>`:marks[i]=='random'?`<div class='mark'><svg viewBox='0 0 80 80' width='80' height='80' fill='none' stroke='#ff0' stroke-width='2.5' stroke-linecap='round'><path d='M40 12 C24 12 18 24 18 34 C18 42 24 46 26 48 L26 56 L54 56 L54 48 C56 46 62 42 62 34 C62 24 56 12 40 12Z'/><circle cx='32' cy='34' r='5'/><circle cx='48' cy='34' r='5'/><path d='M40 40 L37 46 L43 46Z'/><path d='M34 56 L34 50 M40 56 L40 50 M46 56 L46 50'/><path d='M10 60 L70 76 M70 60 L10 76'/></svg></div>`:'');g.appendChild(d)});
 const avg=pop.reduce((s,c)=>s+dist(c,bg),0)/N;
 document.getElementById('stats').innerHTML=`Generation ${gen} | Avg distance from background: ${avg.toFixed(1)}`}
function generation(){let idx=[...pop.keys()].sort((a,b)=>dist(pop[b],bg)-dist(pop[a],bg));
 const eaten=idx.slice(0,Q),rest=shuffle(idx.slice(Q)),killed=rest.slice(0,Q),surv=rest.slice(Q);
 const marks={};eaten.forEach(i=>marks[i]='eaten');killed.forEach(i=>marks[i]='random');
 const s=shuffle(surv.map(i=>pop[i])),next=[];
 for(let k=0;k<s.length;k+=2){const a=s[k],b=s[k+1];next.push(child(a,b),child(b,a),child(a,b),child(b,a))}
 return{marks,next}}
// Animated kill step (design/predator-anim/MOTION-SPEC.md). Selection/breeding unchanged; only timing+visuals.
const STEP_PAUSE=500,STEP_STATIC=1500,SKULL_FADE=350;let stepBusy=false;
function lockUI(on){['step','multi','reset','bgs','rbg','hue','val'].forEach(id=>{const e=document.getElementById(id);if(e)e.disabled=on})}
async function step(){if(stepBusy)return;stepBusy=true;lockUI(true);
 const{marks,next}=generation();render(marks);
 const eaten=Object.keys(marks).filter(i=>marks[i]=='eaten').map(Number),rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
 if(!rm)document.querySelectorAll('#grid .random .mark').forEach(m=>m.animate([{opacity:0},{opacity:1}],{duration:SKULL_FADE,easing:'ease-out',fill:'both'}));
 try{if(window.animatePredator)await animatePredator(document.getElementById('grid'),eaten,'fish')}catch(e){console.error(e)}
 setTimeout(()=>{pop=shuffle(next);gen++;render();stepBusy=false;lockUI(false)},rm?STEP_STATIC:STEP_PAUSE)}
function multi(){const n=+document.getElementById('n').value||1;for(let i=0;i<n;i++){pop=shuffle(generation().next);gen++}render()}
document.getElementById('step').onclick=step;document.getElementById('multi').onclick=multi;document.getElementById('reset').onclick=reset;

function sliderColor(h,t){const p=rgb(fromHSV(h%360,1,1));let c;if(t<=50){const k=t/50;c=p.map(x=>255+(x-255)*k)}else{const k=(t-50)/50;c=p.map(x=>x*(1-k))}
 c=c.map(Math.round);return(c[0]<<16)|(c[1]<<8)|c[2]}
function syncSliders(){const{h,s,v}=toHSV(bg);const H=document.getElementById('hue'),V=document.getElementById('val');H.value=Math.round(h);V.value=Math.round(s>=v?50+50*(1-v):50*s);updVal()}
function updVal(){const h=+document.getElementById('hue').value,p=hex(fromHSV(h%360,1,1));document.getElementById('val').style.background=`linear-gradient(to right,#fff,${p},#000)`}
let lastMarks={};
function onSlide(){updVal();bg=sliderColor(+document.getElementById('hue').value,+document.getElementById('val').value);render(lastMarks)}
document.getElementById('hue').oninput=onSlide;document.getElementById('val').oninput=onSlide;
reset();
</script></body></html>
